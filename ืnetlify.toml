# Netlify Configuration File

[build]
  publish = "dist"
  command = "npm run build"

# 1. PROXY: Forward /line-api requests to LINE servers
[[redirects]]
  from = "/line-api/*"
  to = "https://api.line.me/:splat"
  status = 200
  force = true

# 2. PROXY: FormSubmit (Email)
[[redirects]]
  from = "/email-api/*"
  to = "https://formsubmit.co/ajax/:splat"
  status = 200
  force = true

# 3. SPA Fallback: Send all other traffic to index.html (Must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 4. HEADERS: Fix the "Cross-Origin-Opener-Policy" error
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"